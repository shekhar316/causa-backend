<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Causa Documentation Hub — Architecture, APIs & Guides</title>
    <meta name="description" content="Complete documentation, API references, architecture flowcharts, and tunables for Causa AI Agent.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"Fira Code"', 'monospace'],
                        display: ['"Space Grotesk"', 'sans-serif'],
                    },
                    colors: {
                        causa: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            200: '#b9dffe',
                            300: '#7cc2fd',
                            400: '#369ff8',
                            500: '#0c80eb',
                            600: '#0164c9',
                            700: '#0150a3',
                            800: '#054486',
                            900: '#0a3a6f',
                            950: '#072449',
                        },
                        cyber: {
                            cyan: '#00f2ff',
                            purple: '#a855f7',
                            emerald: '#10b981',
                            amber: '#f59e0b',
                            rose: '#f43f5e',
                            dark: '#030712',
                            card: 'rgba(15, 23, 42, 0.75)',
                            border: 'rgba(255, 255, 255, 0.08)'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Marked Markdown & Highlight.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#030712] text-slate-100 font-sans antialiased h-screen flex flex-col overflow-hidden">

    <!-- Top Header -->
    <header class="h-16 border-b border-white/10 bg-[#070b16]/90 backdrop-blur-xl flex items-center justify-between px-4 sm:px-6 z-30 flex-shrink-0">
        <div class="flex items-center space-x-4">
            <!-- Back to Home -->
            <a href="index.html" class="flex items-center space-x-2 text-slate-400 hover:text-white transition-colors group">
                <div class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center group-hover:border-cyan-400/50 group-hover:bg-cyan-500/10">
                    <i data-lucide="arrow-left" class="w-4 h-4 text-cyan-400 group-hover:-translate-x-0.5 transition-transform"></i>
                </div>
                <span class="text-xs font-mono hidden sm:inline text-slate-300">Back to Landing</span>
            </a>

            <div class="h-5 w-[1px] bg-white/10 hidden sm:block"></div>

            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-causa-500 to-purple-600 flex items-center justify-center text-white shadow-md shadow-causa-500/20">
                    <i data-lucide="book-open" class="w-4 h-4 text-cyan-300"></i>
                </div>
                <div>
                    <span class="text-lg font-bold font-display text-white">Causa Docs</span>
                    <span class="ml-1.5 px-1.5 py-0.5 text-[10px] font-mono rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">v1.0</span>
                </div>
            </div>
        </div>

        <!-- Search Bar & Controls -->
        <div class="flex items-center space-x-3">
            <div class="relative w-48 sm:w-80">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
                <input type="text" id="doc-search-input" placeholder="Search across all 31 docs..." class="w-full pl-9 pr-3 py-1.5 rounded-lg bg-slate-900/90 border border-white/10 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all">
            </div>

            <a href="https://github.com/causaai/causa" target="_blank" rel="noopener noreferrer" class="hidden sm:flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-mono text-slate-300 transition-colors">
                <i data-lucide="github" class="w-3.5 h-3.5"></i>
                <span>GitHub</span>
            </a>

            <!-- Theme Toggle -->
            <button id="theme-toggle" aria-label="Toggle theme" title="Toggle light / dark"
                class="flex items-center justify-center w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 transition-all hover:scale-105 active:scale-95">
                <i data-lucide="sun" class="w-4 h-4 theme-icon-light"></i>
                <i data-lucide="moon" class="w-4 h-4 theme-icon-dark"></i>
            </button>
        </div>
    </header>

    <!-- Main Docs Layout: Left Sidebar + Right Article + On-this-page Outline -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- Left Sidebar: Document Tree -->
        <aside class="w-72 sm:w-80 border-r border-white/10 bg-[#050811] flex flex-col flex-shrink-0 z-20">
            <div class="p-3 border-b border-white/5 flex items-center justify-between text-xs text-slate-400 font-mono">
                <span class="uppercase tracking-wider text-[11px] font-semibold text-slate-400">Documentation Categories</span>
                <span id="total-docs-badge" class="px-1.5 py-0.5 bg-slate-800 rounded text-[10px] text-cyan-300">31 Files</span>
            </div>

            <div class="flex-1 overflow-y-auto p-3 space-y-5" id="docs-sidebar-nav">
                <!-- Populated dynamically via docs-data.js -->
            </div>
        </aside>

        <!-- Center: Markdown Reader & Article -->
        <main class="flex-1 bg-[#030712] overflow-y-auto p-6 sm:p-10 lg:p-12 relative" id="docs-content-container">
            <div class="max-w-4xl mx-auto pb-24">
                
                <!-- Breadcrumbs & Meta Bar -->
                <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-8 border-b border-white/10 text-xs font-mono">
                    <div class="flex items-center space-x-2 text-slate-400">
                        <i data-lucide="file-text" class="w-4 h-4 text-cyan-400"></i>
                        <span id="doc-breadcrumb-category" class="text-cyan-400 uppercase font-semibold">Overview</span>
                        <span>/</span>
                        <span id="doc-breadcrumb-path" class="text-slate-300">README.md</span>
                    </div>

                    <div class="flex items-center space-x-3">
                        <button id="copy-doc-raw-btn" class="flex items-center space-x-1 px-2.5 py-1 rounded bg-slate-900 border border-white/10 hover:border-cyan-400/50 text-slate-400 hover:text-cyan-300 transition-all">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                            <span>Copy Markdown</span>
                        </button>
                    </div>
                </div>

                <!-- Rendered Markdown HTML -->
                <article id="docs-article" class="markdown-body">
                    <!-- Dynamic marked.js output -->
                </article>

                <!-- Footer Navigation between docs -->
                <div class="mt-16 pt-8 border-t border-white/10 flex items-center justify-between" id="doc-footer-nav">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </main>

    </div>

    <!-- Scripts -->
    <script src="docs-data.js"></script>
    <script src="docs.js"></script>
</body>
</html>
