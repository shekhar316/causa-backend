apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: causa-backend
  labels:
    app.kubernetes.io/name: causa-backend
    app.kubernetes.io/component: route
    app.kubernetes.io/part-of: causa
  annotations:
    description: "Route for Causa Backend API"
    haproxy.router.openshift.io/timeout: "60s"
spec:
  host: ""  # OpenShift will auto-generate
  to:
    kind: Service
    name: causa-backend
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
